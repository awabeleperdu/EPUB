<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lecture">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lecture</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<!-- Les erreurs s'affichent ici (pas besoin de console) -->
<div id="err" hidden></div>

<main id="library">
  <header class="lib-head">
    <h1>Bibliothèque</h1>
    <label class="btn-add" for="file">＋ Ajouter</label>
  </header>
  <input id="file" type="file" accept=".epub,application/epub+zip" multiple hidden>
  <div id="grid"></div>
  <div id="empty" class="empty" hidden>
    <div class="empty-ico">📖</div>
    <p>Aucun livre pour l'instant</p>
    <small>Choisis un fichier .epub sur ton téléphone. Il est copié dans l'appli : plus besoin de le rechercher, tu reprends où tu t'es arrêté.</small>
    <label class="btn-big" for="file">Choisir un epub</label>
  </div>
</main>

<section id="reader" hidden>
  <div id="viewer"></div>
  <div id="pct"></div>

  <div class="bar top" id="topbar">
    <button id="back" aria-label="Retour">‹</button>
    <div id="title"></div>
    <button id="btn-toc" aria-label="Chapitres">☰</button>
    <button id="btn-set" aria-label="Réglages">Aa</button>
  </div>
  <div class="bar bottom" id="botbar">
    <input id="slider" type="range" min="0" max="1000" value="0" disabled>
    <span id="slider-val">0 %</span>
  </div>

  <div id="backdrop" hidden></div>
  <aside id="toc" class="sheet" hidden>
    <h2>Chapitres</h2>
    <div id="toc-list"></div>
  </aside>
  <aside id="settings" class="sheet" hidden>
    <h2>Lecture</h2>
    <div class="row"><span>Thème</span>
      <div class="seg" id="seg-theme">
        <button data-v="dark">Sombre</button>
        <button data-v="sepia">Sépia</button>
        <button data-v="light">Clair</button>
      </div>
    </div>
    <div class="row"><span>Taille</span>
      <div class="seg">
        <button id="size-down">A−</button>
        <button id="size-val" disabled>100 %</button>
        <button id="size-up">A+</button>
      </div>
    </div>
    <div class="row"><span>Police</span>
      <div class="seg" id="seg-font">
        <button data-v="serif">Serif</button>
        <button data-v="sans">Sans</button>
      </div>
    </div>
  </aside>
</section>

<div id="busy" hidden><div class="spin"></div><p id="busy-t"></p></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="app.js"></script>
</body>
</html>
